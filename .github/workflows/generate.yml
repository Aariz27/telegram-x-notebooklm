name: Telegram x NotebookLM

on:
  workflow_dispatch:
    inputs:
      notebook_title:
        description: "Title for the NotebookLM notebook"
        required: true
        type: string
      artifacts_json:
        description: "JSON array of artifacts: [{type, length}, ...]"
        required: true
        type: string
      research_query:
        description: "Search query for web research (leave empty to skip)"
        required: false
        type: string
        default: ""
      research_depth:
        description: "Research depth: fast (default) or deep"
        required: false
        type: string
        default: "fast"
      source_urls:
        description: "Comma-separated URLs to add as sources"
        required: false
        type: string
        default: ""
      briefing_text:
        description: "Optional plain text to add as a source"
        required: false
        type: string
        default: ""

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Install notebooklm-py
        run: pip install notebooklm-py

      - name: Create notebook
        id: create
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          RESULT=$(notebooklm create "${{ github.event.inputs.notebook_title }}" --json)
          NB_ID=$(echo $RESULT | python3 -c "import sys,json; print(json.load(sys.stdin)['notebook']['id'])")
          echo "notebook_id=$NB_ID" >> $GITHUB_OUTPUT
          echo "✅ Notebook created: ${{ github.event.inputs.notebook_title }} ($NB_ID)"

      - name: Add text source
        if: ${{ github.event.inputs.briefing_text != '' }}
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          echo "${{ github.event.inputs.briefing_text }}" > /tmp/source.txt
          notebooklm source add /tmp/source.txt \
            --notebook ${{ steps.create.outputs.notebook_id }} --json
          echo "✅ Text source added"

      - name: Add URL sources
        if: ${{ github.event.inputs.source_urls != '' }}
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          IFS=',' read -ra URLS <<< "${{ github.event.inputs.source_urls }}"
          for url in "${URLS[@]}"; do
            url=$(echo "$url" | xargs)
            if [ -n "$url" ]; then
              notebooklm source add "$url" \
                --notebook ${{ steps.create.outputs.notebook_id }} --json || true
            fi
          done
          echo "✅ URL sources added"

      - name: Web research
        if: ${{ github.event.inputs.research_query != '' }}
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          DEPTH="${{ github.event.inputs.research_depth }}"
          echo "🔍 Starting $DEPTH research: ${{ github.event.inputs.research_query }}"
          if [ "$DEPTH" = "deep" ]; then
            notebooklm source add-research "${{ github.event.inputs.research_query }}" \
              --mode deep --no-wait \
              --notebook ${{ steps.create.outputs.notebook_id }}
          else
            notebooklm source add-research "${{ github.event.inputs.research_query }}" \
              --mode fast --import-all \
              --notebook ${{ steps.create.outputs.notebook_id }}
          fi
          echo "✅ Research done"

      - name: Wait for deep research to import
        if: ${{ github.event.inputs.research_query != '' && github.event.inputs.research_depth == 'deep' }}
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          notebooklm research wait \
            -n ${{ steps.create.outputs.notebook_id }} \
            --import-all --timeout 600 || true
          echo "✅ Research imported"

      - name: Wait for sources to be indexed
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          echo "⏳ Waiting for sources to index..."
          for i in $(seq 1 30); do
            OUTPUT=$(notebooklm source list --notebook ${{ steps.create.outputs.notebook_id }} --json)
            COUNT=$(echo $OUTPUT | python3 -c "import sys,json; print(len(json.load(sys.stdin)['sources']))")
            STATUS=$(echo $OUTPUT | python3 -c "import sys,json; s=json.load(sys.stdin)['sources']; print(len(s) > 0 and all(x['status']=='ready' for x in s))")
            echo "Sources: $COUNT total, all ready: $STATUS (attempt $i/30)"
            if [ "$STATUS" = "True" ]; then break; fi
            sleep 20
          done

      - name: Generate and deliver all artifacts
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          NOTEBOOK_ID="${{ steps.create.outputs.notebook_id }}"
          ARTIFACTS='${{ github.event.inputs.artifacts_json }}'
          COUNT=$(echo "$ARTIFACTS" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "🎨 Generating $COUNT artifact(s)..."

          for i in $(seq 0 $((COUNT-1))); do
            TYPE=$(echo "$ARTIFACTS" | python3 -c "import sys,json; a=json.load(sys.stdin); print(a[$i]['type'])")
            LENGTH=$(echo "$ARTIFACTS" | python3 -c "import sys,json; a=json.load(sys.stdin); print(a[$i].get('length','short'))")
            NUM=$((i+1))
            echo ""
            echo "--- Artifact $NUM/$COUNT: $TYPE ($LENGTH) ---"

            # Generate
            RESULT=$(notebooklm generate $TYPE \
              --length $LENGTH \
              --notebook $NOTEBOOK_ID --json)
            TASK_ID=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('task_id',''))")
            echo "Task ID: $TASK_ID"

            # Wait for completion
            if [ -n "$TASK_ID" ]; then
              notebooklm artifact wait $TASK_ID \
                --notebook $NOTEBOOK_ID \
                --timeout 3600
            fi

            # Map type → extension
            case "$TYPE" in
              audio)       EXT="mp3" ;;
              video)       EXT="mp4" ;;
              slide-deck)  EXT="pdf" ;;
              report)      EXT="md"  ;;
              mind-map)    EXT="json" ;;
              quiz)        EXT="json" ;;
              flashcards)  EXT="json" ;;
              infographic) EXT="png" ;;
              *)           EXT="bin" ;;
            esac

            OUT="/tmp/output-${i}.${EXT}"
            notebooklm download $TYPE $OUT --notebook $NOTEBOOK_ID
            echo "✅ Downloaded: $OUT"

            # Send to Telegram
            CAPTION="✅ ${{ github.event.inputs.notebook_title }} — $TYPE ($NUM/$COUNT)"
            if [ "$EXT" = "mp3" ]; then
              curl -s \
                -F chat_id=$TELEGRAM_CHAT_ID \
                -F audio=@"$OUT" \
                -F caption="$CAPTION" \
                https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendAudio
            else
              curl -s \
                -F chat_id=$TELEGRAM_CHAT_ID \
                -F document=@"$OUT" \
                -F caption="$CAPTION" \
                https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument
            fi
            echo "✅ Sent to Telegram"
          done

      - name: Cleanup notebook
        if: always()
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          notebooklm notebook delete ${{ steps.create.outputs.notebook_id }} || true
          echo "🧹 Notebook deleted"
