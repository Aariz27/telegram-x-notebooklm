name: Telegram x NotebookLM

on:
  workflow_dispatch:
    inputs:
      notebook_title:
        description: "Title for the NotebookLM notebook"
        required: true
        type: string
      artifact_type:
        description: "Type: audio, slide-deck, report, quiz, flashcards, mind-map, infographic, video"
        required: true
        type: string
        default: "audio"
      artifact_length:
        description: "Length: short, default, long"
        required: false
        type: string
        default: "short"
      research_query:
        description: "Search query for web research (leave empty to skip)"
        required: false
        type: string
        default: ""
      source_urls:
        description: "Comma-separated URLs to add as sources (leave empty to skip)"
        required: false
        type: string
        default: ""
      briefing_text:
        description: "Optional plain text to add as a source"
        required: false
        type: string
        default: ""

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Install notebooklm-py
        run: pip install notebooklm-py

      - name: Create notebook
        id: create
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          RESULT=$(notebooklm create "${{ github.event.inputs.notebook_title }}" --json)
          echo "notebook_id=$(echo $RESULT | python3 -c "import sys,json; print(json.load(sys.stdin)['notebook']['id'])")" >> $GITHUB_OUTPUT
          echo "✅ Notebook created: ${{ github.event.inputs.notebook_title }}"

      - name: Add text source
        if: ${{ github.event.inputs.briefing_text != '' }}
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          echo "${{ github.event.inputs.briefing_text }}" > /tmp/source.txt
          notebooklm source add /tmp/source.txt \
            --notebook ${{ steps.create.outputs.notebook_id }} --json
          echo "✅ Text source added"

      - name: Add URL sources
        if: ${{ github.event.inputs.source_urls != '' }}
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          IFS=',' read -ra URLS <<< "${{ github.event.inputs.source_urls }}"
          for url in "${URLS[@]}"; do
            url=$(echo "$url" | xargs)
            if [ -n "$url" ]; then
              echo "Adding URL: $url"
              notebooklm source add "$url" \
                --notebook ${{ steps.create.outputs.notebook_id }} --json || true
            fi
          done
          echo "✅ URL sources added"

      - name: Web research
        if: ${{ github.event.inputs.research_query != '' }}
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          echo "🔍 Researching: ${{ github.event.inputs.research_query }}"
          notebooklm source add-research "${{ github.event.inputs.research_query }}" \
            --mode deep --import-all \
            --notebook ${{ steps.create.outputs.notebook_id }}
          echo "✅ Research complete"

      - name: Wait for sources to be ready
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          echo "⏳ Waiting for sources to index..."
          for i in $(seq 1 24); do
            STATUS=$(notebooklm source list --notebook ${{ steps.create.outputs.notebook_id }} --json \
              | python3 -c "import sys,json; sources=json.load(sys.stdin)['sources']; print(all(s['status']=='ready' for s in sources) if sources else False)")
            echo "Sources ready: $STATUS (attempt $i/24)"
            if [ "$STATUS" = "True" ]; then break; fi
            sleep 15
          done

      - name: Generate artifact
        id: generate
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          ARTIFACT_TYPE="${{ github.event.inputs.artifact_type }}"
          LENGTH="${{ github.event.inputs.artifact_length }}"
          echo "🎨 Generating $ARTIFACT_TYPE..."

          # mind-map is sync (no wait needed), others are async
          if [ "$ARTIFACT_TYPE" = "mind-map" ]; then
            RESULT=$(notebooklm generate mind-map \
              --notebook ${{ steps.create.outputs.notebook_id }} --json)
          else
            RESULT=$(notebooklm generate $ARTIFACT_TYPE \
              --length $LENGTH \
              --notebook ${{ steps.create.outputs.notebook_id }} --json)
          fi

          TASK_ID=$(echo $RESULT | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('task_id', ''))")
          echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
          echo "artifact_type=$ARTIFACT_TYPE" >> $GITHUB_OUTPUT
          echo "✅ Generation started: $TASK_ID"

      - name: Wait for generation to complete
        if: ${{ steps.generate.outputs.task_id != '' }}
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          echo "⏳ Waiting for generation..."
          notebooklm artifact wait ${{ steps.generate.outputs.task_id }} \
            --notebook ${{ steps.create.outputs.notebook_id }} \
            --timeout 3600

      - name: Download artifact
        id: download
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          ARTIFACT_TYPE="${{ github.event.inputs.artifact_type }}"

          # Map type to file extension
          case "$ARTIFACT_TYPE" in
            audio)      EXT="mp3" ;;
            video)      EXT="mp4" ;;
            slide-deck) EXT="pdf" ;;
            report)     EXT="md"  ;;
            mind-map)   EXT="json" ;;
            quiz)       EXT="json" ;;
            flashcards) EXT="json" ;;
            infographic) EXT="png" ;;
            *)          EXT="bin" ;;
          esac

          OUT="/tmp/output.$EXT"
          notebooklm download $ARTIFACT_TYPE $OUT \
            --notebook ${{ steps.create.outputs.notebook_id }}

          echo "file_path=$OUT" >> $GITHUB_OUTPUT
          echo "file_ext=$EXT" >> $GITHUB_OUTPUT
          echo "✅ Downloaded: $OUT"

      - name: Send to Telegram
        run: |
          FILE="${{ steps.download.outputs.file_path }}"
          EXT="${{ steps.download.outputs.file_ext }}"
          CAPTION="✅ ${{ github.event.inputs.notebook_title }} — ${{ github.event.inputs.artifact_type }} ready"

          # Use sendAudio for mp3, sendDocument for everything else
          if [ "$EXT" = "mp3" ]; then
            curl -s \
              -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
              -F audio=@"$FILE" \
              -F caption="$CAPTION" \
              https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendAudio
          else
            curl -s \
              -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
              -F document=@"$FILE" \
              -F caption="$CAPTION" \
              https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument
          fi
          echo "✅ Sent to Telegram"

      - name: Cleanup notebook
        if: always()
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          notebooklm notebook delete ${{ steps.create.outputs.notebook_id }} || true
          echo "🧹 Notebook deleted"
